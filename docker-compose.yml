version: "3.9"

services:

  backend:
    build: ./backend

    ports:
      - "8080:8080"

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: clutchfactor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5433:5432"